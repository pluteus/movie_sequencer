<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%231b1d24'/%3E%3Crect x='72' y='96' width='150' height='110' rx='18' fill='%234da3ff'/%3E%3Crect x='290' y='306' width='150' height='110' rx='18' fill='%23ffb84d'/%3E%3Cpath d='M222 160 C300 160 300 260 366 296' stroke='%23fff' stroke-width='22' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{--bg:#1b1d24;--panel:#2a2d38;--panel2:#363a48;--fg:#e8ecf4;--accent:#ffb84d;--blue:#4da3ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #ui{position:fixed;left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:6px;z-index:10}
  .row{display:flex;gap:6px}
  .row[hidden]{display:none}
  button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid #444a5c;border-radius:10px;
    min-height:44px;padding:0 14px;cursor:pointer;opacity:.96}
  button:active{background:var(--panel2)}
  button:disabled{opacity:.4}
  button.on{border-color:var(--accent);color:var(--accent)}
  #popup{position:fixed;z-index:30;display:flex;flex-direction:column;gap:4px;padding:6px;
    background:#23262f;border:1px solid #444a5c;border-radius:12px;box-shadow:0 8px 24px #0008;min-width:160px;max-height:calc(100vh - 12px);overflow-y:auto}
  #popup[hidden]{display:none}
  #popup button{text-align:left;border:none;background:transparent;min-height:42px;white-space:nowrap}
  #popup button:active{background:var(--panel2)}
  #popup button.on{color:var(--accent)}
  #dlg{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:center;justify-content:center}
  #dlg[hidden]{display:none}
  #setDlg{position:fixed;inset:0;z-index:70;background:#0008;display:flex;align-items:center;justify-content:center}
  #setDlg[hidden]{display:none}
  #setDlg .card{max-height:calc(100vh - 24px);overflow-y:auto}
  .card label{display:flex;flex-direction:column;gap:4px;font-size:14px}
  .card .hint{font-size:12px;color:#aab2c5;line-height:1.5}
  body.dragging::after{content:'ここにドロップして画像・動画を再リンク';position:fixed;inset:8px;z-index:80;display:flex;align-items:center;justify-content:center;
    border:3px dashed var(--accent);border-radius:16px;background:#000a;color:var(--accent);font-size:16px;pointer-events:none}
  #modeBtn,#arrBtn{min-width:44px;padding:0 10px;font-size:18px;line-height:1}
  .card{background:#23262f;border:1px solid #444a5c;border-radius:14px;padding:16px;width:min(340px,90vw);
    display:flex;flex-direction:column;gap:12px}
  .card input{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid #444a5c;
    border-radius:8px;padding:10px;width:100%;-webkit-user-select:text;user-select:text}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btns button{flex:1}
  #dlgOk,#setOk{background:var(--blue);color:#06121f;border-color:var(--blue)}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:90;
    pointer-events:none;opacity:0;transition:opacity .2s;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  /* 右上ボタン */
  #ui2{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));
    display:flex;gap:6px;z-index:10}
  .ib{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 10px;
    font:inherit;font-size:18px;line-height:1;color:var(--fg);background:var(--panel);border:1px solid #444a5c;
    border-radius:10px;text-decoration:none;cursor:pointer;opacity:.96}
  .ib:active{background:var(--panel2)}
  .ib.on{border-color:var(--accent);color:var(--accent)}
  /* 連続再生ポップアップ */
  #player{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;
    padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
  #player[hidden]{display:none}
  .pwin{position:relative;width:min(100%,1200px);height:100%;background:#000;border:1px solid #444a5c;border-radius:14px;
    overflow:hidden;box-shadow:0 12px 40px #000a}
  .stage{position:absolute;inset:0}
  .stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;visibility:hidden}
  #pCap{position:absolute;left:14px;right:64px;bottom:10px;font-size:12px;color:#aab2c5;text-shadow:0 1px 3px #000;
    pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbtn{position:absolute;top:8px;z-index:2;width:44px;height:44px;padding:0;border-radius:22px;background:#000a;font-size:18px}
  #pClose{right:8px} #pMax{right:58px} #pMin{right:108px}
  /* 縮小表示：キャンバスを操作できるよう、右下に小さく表示する */
  #player.mini{background:transparent;pointer-events:none;align-items:flex-end;justify-content:flex-end}
  #player.mini .pwin{pointer-events:auto;width:min(48vw,300px);height:auto;aspect-ratio:16/9;border-color:#ffe600;
    box-shadow:0 6px 20px #000b,0 0 0 2px #ffe60066}
  #player.mini .pbtn{top:4px;width:30px;height:30px;border-radius:15px;font-size:14px}
  #player.mini #pClose{right:4px} #player.mini #pMax{right:38px} #player.mini #pMin{right:72px}
  #player.mini #pCap{display:none}
</style>

<body>
<canvas id="cv"></canvas>

<div id="ui">
  <div class="row">
    <button id="fileBtn" aria-label="ファイル操作">📁</button>
    <button id="modeBtn" aria-label="編集モード"></button>
    <button id="arrBtn" aria-label="編集" title="編集">🛠</button>
  </div>
  <div class="row" id="connRow" hidden>
    <button id="cFwd">選択順 →</button>
    <button id="cRev">← 逆順</button>
    <button id="cBoth">↔ 両方</button>
    <button id="cDel">接続解除</button>
  </div>
</div>

<div id="ui2">
  <button id="playBtn" class="ib" aria-label="連続再生" title="連続再生">▶</button>
  <a id="helpBtn" class="ib" href="about.html" target="_blank" rel="noopener" aria-label="ヘルプ" title="ヘルプ">?</a>
  <button id="setBtn" class="ib" aria-label="設定" title="設定">⚙</button>
  <button id="fsBtn" class="ib" aria-label="フルスクリーン" title="フルスクリーン">⛶</button>

<div id="popup" hidden></div>

<div id="dlg" hidden>
  <div class="card">
    <div>ノード名を入力、または画像・動画を選択</div>
    <input id="nameIn" type="text" placeholder="ノード名" autocomplete="off">
    <div class="btns">
      <button id="dlgImg">🖼 画像から作成</button>
      <button id="dlgVid">🎞 動画から作成</button>
    </div>
    <div class="btns">
      <button id="dlgCancel">キャンセル</button>
      <button id="dlgOk">追加</button>
    </div>
  </div>
</div>

<div id="setDlg" hidden>
  <div class="card">
    <div>⚙ 設定</div>
    <label>静止画の再生秒数（秒）
      <input id="setStill" type="number" min="0.1" max="60" step="0.1" inputmode="decimal">
    </label>
    <label>同じ箇所の最大ループ回数
      <input id="setLoop" type="number" min="1" max="99" step="1" inputmode="numeric">
    </label>
    <div class="hint">連続再生中に、同じノード／矢印へ入ろうとして回数がこの値に達すると、ランダムなノードまたは矢印へジャンプして再生を再開します。</div>
    <hr style="width:100%;border:0;border-top:1px solid #444a5c;margin:2px 0">
    <label>LM Studio のURL（画像のタグ付け用）
      <input id="setLmUrl" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="http://localhost:1234/v1">
    </label>
    <label>モデルID（空なら自動選択）
      <input id="setLmModel" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="LM Studio のモデル名">
    </label>
    <label>タグの語彙（任意・カンマ区切り）
      <input id="setVocab" type="text" placeholder="空なら自由にタグを付ける">
    </label>
    <div class="hint">語彙を入れると、その中からだけタグを選びます（表記ゆれを防げます）。画像は上のURLのサーバーにだけ送られます。</div>
    <label style="flex-direction:row;align-items:center;gap:8px"><input id="setNoThink" type="checkbox" style="width:auto;padding:0"><span>思考を飛ばす（空の thinking を返答の先頭に入れる）</span></label>
    <div class="btns"><button id="setLmTest">🔌 接続テスト</button></div>
    <div class="btns">
      <button id="setCancel">キャンセル</button>
      <button id="setOk">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<input id="imgPick" type="file" accept="image/*" hidden>
<input id="vidPick" type="file" accept="video/*" hidden>
<input id="zipPick" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden>
<input id="jsonPick" type="file" accept=".json,application/json" hidden>
<input id="mediaPick" type="file" accept="image/*,video/*" multiple hidden>

<script>
(() => {
'use strict';

/* ---------- 基本 ---------- */
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const STORE = 'keyframe-map.v1';
let W = 0, H = 0, dpr = 1;
const view = { x: 0, y: 0, s: 1 };          // screen = world * s + (x, y)
let nodes = [], arrows = [];                 // 矢印の from/to が null ＝ ノードにつながっていない「未リンクの矢印」（位置は ux, uy）
const sel = { nodes: [], arrow: null, garrows: [], grp: false };   // nodes＝選択順／garrows＝範囲選択した未リンクの矢印／grp＝範囲選択・全選択（外枠と四隅のハンドルを表示）
let band = null;                             // レイアウトモードの範囲選択（画面座標）{x0,y0,x1,y1}
let nowPlaying = null;                       // 連続再生中の項目 {k:'node'|'arrow', id}（黄色で強調）
const YEL = '#ffe600';
const isNow = (k, id) => !!nowPlaying && nowPlaying.k === k && nowPlaying.id === id;
let mode = 'pencil';
const mediaFile = new Map();                 // ファイル名 -> File（ZIP保存用）
const media = new Map();                     // ファイル名 -> objectURL
const imgs = new Map(), vids = new Map();    // ファイル名 -> {el, ok}
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const nodeById = id => nodes.find(n => n.id === id);
const arrowById = id => arrows.find(a => a.id === id);
const isFree = a => a.from == null || a.to == null;
const toWorld = (px, py) => ({ x: (px - view.x) / view.s, y: (py - view.y) / view.s });

const MODES = {
  pencil: '✏️ ペンシル',
  connect: '🔗 接続編集',
  layout: '📐 レイアウト・タグ',
  hand: '✋ ハンド'
};
const MODE_ICON = { pencil: '✏️', connect: '🔗', layout: '📐', hand: '✋' };
const NODE_W = 120, NODE_H = 44;

let toastT = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), Math.max(2600, msg.length * 110));
}

/* ---------- メディア ---------- */
/* ファイル内容のハッシュ（リネームされても再リンクできるようにJSONへ保存する） */
const mediaHash = new Map();                 // ファイル名 -> ハッシュ
const hashJobs = new Map();                  // ファイル名 -> Promise<ハッシュ|null>
const FULL_MAX = 32 * 1024 * 1024, CHUNK = 4 * 1024 * 1024;
const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function fileHash(file) {
  if (!(window.crypto && crypto.subtle)) return null;
  if (file.size <= FULL_MAX) return 'sha256:' + toHex(await crypto.subtle.digest('SHA-256', await file.arrayBuffer()));
  // 大きいファイルは「サイズ＋先頭・中央・末尾の各4MB」から計算（全読み込みによるメモリ不足を避ける）
  const bufs = [new TextEncoder().encode(file.size + ':')];
  for (const o of [0, Math.floor((file.size - CHUNK) / 2), file.size - CHUNK]) {
    bufs.push(new Uint8Array(await file.slice(o, o + CHUNK).arrayBuffer()));
  }
  const all = new Uint8Array(bufs.reduce((n, b) => n + b.length, 0));
  let pos = 0; bufs.forEach(b => { all.set(b, pos); pos += b.length; });
  return 'sha256q:' + toHex(await crypto.subtle.digest('SHA-256', all));
}
function registerFile(file, preHash) {      // preHash：計算済みのハッシュ（省略時はここで計算）
  const old = media.get(file.name);
  if (old) URL.revokeObjectURL(old);
  media.set(file.name, URL.createObjectURL(file));
  mediaFile.set(file.name, file);
  imgs.delete(file.name);
  arrows.forEach(a => { if (a.video === file.name) a.rt = 'idle'; });
  const v = vids.get(file.name);
  if (v) { v.el.pause(); vids.delete(file.name); }
  mediaHash.delete(file.name);
  let job;
  if (preHash !== undefined) {
    job = Promise.resolve(preHash || null);
    if (preHash) mediaHash.set(file.name, preHash);
  } else {
    job = fileHash(file).then(h => { if (hashJobs.get(file.name) === job && h) mediaHash.set(file.name, h); return h; }, () => null);
  }
  hashJobs.set(file.name, job);
  return file.name;
}
function findByHash(h) {                     // 読み込み済みメディアからハッシュ一致のファイル名を探す
  if (!h) return null;
  for (const [name, hh] of mediaHash) if (hh === h && media.has(name)) return name;
  return null;
}
function relinkRefs() {                      // 戻り値：ハッシュ一致でファイル名を更新した件数
  let renamed = 0;
  const fix = (o, nameKey, hashKey) => {
    const nm = o[nameKey]; if (!nm) return;
    if (media.has(nm)) {                     // ファイル名が見つかった：ハッシュを現在の内容に合わせる
      const h = mediaHash.get(nm);
      if (h) o[hashKey] = h;
      return;
    }
    const alt = findByHash(o[hashKey]);      // 見つからない：ハッシュが一致するファイルへ付け替える
    if (alt) { o[nameKey] = alt; renamed++; }
  };
  nodes.forEach(n => fix(n, 'image', 'imageHash'));
  arrows.forEach(a => fix(a, 'video', 'videoHash'));
  return renamed;
}
function getImg(name) {
  if (!media.has(name)) return null;
  let e = imgs.get(name);
  if (!e) {
    e = { el: new Image(), ok: false };
    e.el.onload = () => { e.ok = true; draw(); };
    e.el.src = media.get(name);
    imgs.set(name, e);
  }
  return e;
}
function getVid(name) {
  if (!media.has(name)) return null;
  let e = vids.get(name);
  if (!e) {
    const v = document.createElement('video');
    v.playsInline = true; v.preload = 'auto';
    e = { el: v, ok: false };
    v.onloadeddata = () => { e.ok = true; try { v.currentTime = 0.01; } catch (_) {} draw(); };
    v.onseeked = draw; v.onplay = draw;
    v.onpause = () => {
      if (v.ended) return;
      arrows.forEach(a => { if (a.video === name && a.rt === 'play') a.rt = 'paused'; });
      draw();
    };
    v.onended = () => {
      arrows.forEach(a => { if (a.video === name && a.rt === 'play') a.rt = 'end'; });
      draw();
    };
    v.src = media.get(name);
    vids.set(name, e);
  }
  return e;
}
const anyPlaying = () => [...vids.values()].some(e => !e.el.paused && !e.el.ended);

/* 登録済みのファイル名を、ノードの画像／矢印の動画として設定する */
function applyNodeImage(n, name, done) {
  const probe = new Image();
  probe.onload = () => {
    n.image = name; n.imageHash = null;
    hashJobs.get(name).then(h => { if (n.image === name) { n.imageHash = h; save(); } });
    n.pw = n.pw || 160;
    n.ph = n.pw * probe.naturalHeight / probe.naturalWidth;
    save(); draw(); if (done) done(n);
  };
  probe.onerror = () => toast('画像を読み込めませんでした');
  probe.src = media.get(name);
}
function applyArrowVideo(a, name, fail, done) {
  const v = document.createElement('video');
  v.preload = 'metadata';
  v.onloadedmetadata = () => {
    a.video = name; a.videoHash = null;
    hashJobs.get(name).then(h => { if (a.video === name) { a.videoHash = h; save(); } });
    a.rt = 'idle';
    a.vw = a.vw || 200;
    a.vh = a.vw * v.videoHeight / v.videoWidth;
    save(); draw();
    if (done) done(a);
  };
  v.onerror = () => { toast('動画を読み込めませんでした'); if (fail) fail(); };
  v.src = media.get(name);
}
function setNodeImage(n, file, done) { applyNodeImage(n, registerFile(file), done); }
// 未リンクの矢印に動画が設定されたら、先頭・最終フレームのノードを自動生成して接続する
function setArrowVideo(a, file) { applyArrowVideo(a, registerFile(file), null, isFree(a) ? autoFrames : null); }

/* ---------- 先頭・最終フレームの自動生成 ---------- */
const generated = new Set();                 // 自動生成した静止画のファイル名
const uniqueName = n => {
  if (!media.has(n)) return n;
  const m = n.replace(/\.[^.]+$/, ''), e = n.slice(m.length);
  let i = 2; while (media.has(m + '_' + i + e)) i++;
  return m + '_' + i + e;
};
function seekTo(v, t) {
  return new Promise((res, rej) => {
    if (Math.abs(v.currentTime - t) < 0.001 && v.readyState >= 2) return res();
    const to = setTimeout(() => rej(new Error('seek')), 8000);
    v.onseeked = () => { clearTimeout(to); res(); };
    v.onerror = () => { clearTimeout(to); rej(new Error('seek')); };
    v.currentTime = t;
  });
}
async function extractFrames(name, which) {   // which: 'first'／'last'（省略時は両方）         // 動画の先頭・最終フレームをPNGにする
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto';
  v.src = media.get(name);
  try {
    await new Promise((res, rej) => {
      const to = setTimeout(() => rej(new Error('load')), 10000);
      v.onloadeddata = () => { clearTimeout(to); res(); };
      v.onerror = () => { clearTimeout(to); rej(new Error('load')); };
    });
    const dur = v.duration, w = v.videoWidth, h = v.videoHeight;
    if (!w || !h || !isFinite(dur) || dur <= 0) throw new Error('meta');
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const cx = c.getContext('2d');
    const grab = async t => {
      await seekTo(v, t);
      cx.drawImage(v, 0, 0, w, h);
      return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'));
    };
    const first = which === 'last' ? null : await grab(0), last = which === 'first' ? null : await grab(dur);
    return { first, last, w, h };
  } finally { v.removeAttribute('src'); v.load(); }
}
async function autoFrames(a) {               // 先頭フレームノード → 動画矢印 → 最終フレームノード
  if (!a || a.framing || !a.video || !isFree(a) || !media.has(a.video)) return false;
  const name = a.video;
  a.framing = true;
  try {
    const fr = await extractFrames(name);

  }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  }
  const np = isNow('arrow', a.id);
  ctx.lineWidth = np ? 5 : s ? 3 : 1.5;
  ctx.strokeStyle = np ? YEL : s ? '#ffb84d' : '#9fb4d6';
  if (np) { ctx.shadowColor = YEL; ctx.shadowBlur = 16; }
  if (!media.has(a.video)) ctx.setLineDash([6, 4]);
  rr(x, y, w, h, 8); ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur = 0;
  const playing = rt === 'play' && ve && !ve.el.paused && !ve.el.ended;
  if (!playing) {
    const r = Math.min(24, w / 4, h / 3);
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.arc(g.vc.x, g.vc.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(g.vc.x - r * .3, g.vc.y - r * .5);
    ctx.lineTo(g.vc.x + r * .55, g.vc.y);
    ctx.lineTo(g.vc.x - r * .3, g.vc.y + r * .5);

  ctx.textAlign = 'center'; ctx.textBaseline = 'top';

  ctx.restore();
  drawTags(a);
  ctx.save();
  if (g.free) {                              // ノードにつながっていない矢印の目印
    ctx.fillStyle = '#ffb84d'; ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('未接続', x, y - 4);
  }
  ctx.restore();
}

function drawNode(n) {
  const b = box(n), x = n.x - b.w / 2, y = n.y - b.h / 2;
  const idx = sel.nodes.indexOf(n.id), isSel = idx >= 0;
  ctx.save();

    if (im && im.ok) {
      ctx.drawImage(im.el, x, y, b.w, b.h);

    } else {
      ctx.fillStyle = '#2f3340'; ctx.fillRect(x, y, b.w, b.h);
      ctx.strokeStyle = '#8b93a8'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
      ctx.strokeRect(x, y, b.w, b.h); ctx.setLineDash([]);
      ctx.fillStyle = '#8b93a8'; ctx.font = '12px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(fit(n.image, b.w - 12), n.x, n.y);
    }
    ctx.fillStyle = '#e8ecf4'; ctx.font = '13px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(fit(n.name, Math.max(b.w, 100)), n.x, y + b.h + 4);
  } else {
    ctx.fillStyle = '#2f4a7a'; rr(x, y, b.w, b.h, 10); ctx.fill();
    ctx.strokeStyle = '#6f93d1'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(fit(n.name, b.w - 14), n.x, n.y);
  }
  ctx.restore();
  drawTags(n);
  ctx.save();
  if (isNow('node', n.id)) {
    ctx.strokeStyle = YEL; ctx.lineWidth = Math.max(5, 5 / view.s);
    ctx.shadowColor = YEL; ctx.shadowBlur = 18;
    rr(x - 6, y - 6, b.w + 12, b.h + 12 + nodeExtra(n), 10); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  if (isSel) {
    ctx.strokeStyle = '#ffb84d'; ctx.lineWidth = Math.max(2.5, 3 / view.s);
    rr(x - 4, y - 4, b.w + 8, b.h + 8, 8); ctx.stroke();
    if (mode === 'connect') {
      const r = 11;
      ctx.fillStyle = '#ffb84d';
      ctx.beginPath(); ctx.arc(x - 4, y - 4, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1b1d24'; ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(idx + 1), x - 4, y - 3);
    }
  }
  ctx.restore();
}

/* ---------- 選択 ---------- */
/* 接続編集モードでは「2ノード」「2ノード＋未リンクの矢印」「リンク済みの矢印1本」を選べる */
function selectNode(id) {
  if (mode === 'connect') {
    const i = sel.nodes.indexOf(id);
    if (i >= 0) sel.nodes.splice(i, 1);
    else { sel.nodes.push(id); if (sel.nodes.length > 2) sel.nodes.shift(); }
    const a = sel.arrow && arrowById(sel.arrow);
    if (a && !isFree(a)) sel.arrow = null;   // リンク済みの矢印とノードは同時に選べない
  } else { sel.nodes = [id]; sel.arrow = null; }
  sel.garrows = []; sel.grp = false;
}
function selectArrow(id) {
  const a = arrowById(id);
  sel.garrows = []; sel.grp = false;
  if (mode === 'connect' && a && isFree(a)) { sel.arrow = id; return; }   // 未リンクの矢印はノード選択を保つ
  sel.nodes = []; sel.arrow = id;
}
function clearSel() { sel.nodes = []; sel.arrow = null; sel.garrows = []; sel.grp = false; }

/* ---------- 接続 ---------- */
function pairArrows() {
  if (sel.nodes.length !== 2) return { ab: null, ba: null };
  const [a, b] = sel.nodes;
  return {
    ab: arrows.find(x => x.from === a && x.to === b) || null,
    ba: arrows.find(x => x.from === b && x.to === a) || null
  };
}
/* kind: nodes＝2ノード / free＝2ノード＋未リンクの矢印 / linked＝リンク済みの矢印 / none */
function connState() {
  const a = sel.arrow ? arrowById(sel.arrow) : null;
  if (a && !isFree(a)) return { kind: 'linked', a };
  if (sel.nodes.length === 2) return { kind: a ? 'free' : 'nodes', a };
  if (sel.nodes.length === 1 && a && isFree(a)) return { kind: 'nodefree', a, node: nodeById(sel.nodes[0]) };   // 1ノード＋未リンクの矢印
  return { kind: 'none', a };
}
const reverseOf = x => arrows.find(y => y !== x && y.from === x.to && y.to === x.from) || null;
function updateConnUI() {
  const st = connState();
  const bt = { fwd: $('#cFwd'), rev: $('#cRev'), both: $('#cBoth'), del: $('#cDel') };
  Object.values(bt).forEach(b => { b.disabled = true; b.classList.remove('on'); });
  if (st.kind === 'linked') {
    const ba = reverseOf(st.a);              // 逆向きの矢印がすでにあれば「逆順」「両方」は不要
    bt.rev.disabled = !!ba; bt.both.disabled = !!ba; bt.del.disabled = false;
    bt.both.classList.toggle('on', !!ba);
  } else if (st.kind === 'nodefree') {         // 1ノード＋未リンクの矢印：もう一方の端は動画の先頭／最終フレームから自動生成する
    const ok = !!(st.a.video && media.has(st.a.video)) && !!st.node;
    bt.fwd.disabled = bt.rev.disabled = bt.both.disabled = !ok;
    bt.del.disabled = !(st.node && arrows.some(x => x.from === st.node.id || x.to === st.node.id));
  } else if (st.kind === 'nodes' || st.kind === 'free') {
    const { ab, ba } = pairArrows();
    if (st.kind === 'nodes') { bt.fwd.disabled = bt.rev.disabled = bt.both.disabled = false; }
    else { bt.fwd.disabled = !!ab; bt.rev.disabled = !!ba; bt.both.disabled = !!(ab && ba); }
    bt.del.disabled = !(ab || ba);
    bt.fwd.classList.toggle('on', !!ab && !ba);
    bt.rev.classList.toggle('on', !!ba && !ab);
    bt.both.classList.toggle('on', !!ab && !!ba);
  }
}
const newArrow = (f, t) => ({ id: uid(), from: f, to: t, ux: null, uy: null, video: null, videoHash: null, vw: null, vh: null });
function connect(dir) {
  const st = connState();
  if (st.kind === 'linked') return connectLinked(dir, st.a);
  if (st.kind === 'free') return attachFree(dir, st.a);
  if (st.kind === 'nodefree') return attachFreeToNode(dir, st.a, st.node);
  if (sel.nodes.length !== 2) return;
  const [a, b] = sel.nodes;
  const { ab, ba } = pairArrows();
  const mk = (f, t) => arrows.push(newArrow(f, t));
  const rm = x => { arrows = arrows.filter(y => y !== x); if (sel.arrow === x.id) sel.arrow = null; };
  if (dir === 'fwd') {
    if (ab) { if (ba) rm(ba); }
    else if (ba) { ba.from = a; ba.to = b; } else mk(a, b);
  } else if (dir === 'rev') {
    if (ba) { if (ab) rm(ab); }
    else if (ab) { ab.from = b; ab.to = a; } else mk(b, a);
  } else {
    if (!ab) mk(a, b);
    if (!ba) mk(b, a);
  }
  save(); updateConnUI(); draw();
}
/* 未リンクの矢印を、選択した2ノードの間につなぐ */
/* 1ノード＋未リンクの矢印：選択ノードを矢印の始点（選択順）／終点（逆順）にし、もう一方の端は動画の最終／先頭フレームから静止画ノードを自動生成する。
   両方：選択順の接続に加えて、逆向きの動画なしの矢印を追加する */
async function attachFreeToNode(dir, u, node) {
  if (!node || !u.video || !media.has(u.video)) return toast('動画が再リンクされていないため、静止画を生成できません');
  if (u.framing) return;
  const which = dir === 'rev' ? 'first' : 'last';
  u.framing = true;
  toast('フレームを生成中…');
  try {
    const fr = await extractFrames(u.video, which);
    if (!arrowById(u.id) || !isFree(u) || !nodeById(node.id)) return;
    const base = u.video.replace(/\.[^.]+$/, '');
    const fn = registerFile(new File([fr[which]], uniqueName(base + '_' + which + '.png'), { type: 'image/png' }));
    generated.add(fn);
    const d = box(node).w / 2 + 80 + u.vw + 60;       // 動画プレビューがノードに重ならない間隔
    const gn = { id: uid(), name: base + ' ' + (which === 'first' ? '先頭' : '最終'), x: node.x + (dir === 'rev' ? -d : d), y: node.y,
      image: fn, imageHash: null, pw: 160, ph: 160 * fr.h / fr.w };
    hashJobs.get(fn).then(h => { if (gn.image === fn) { gn.imageHash = h; save(); } });
    nodes.push(gn);
    if (dir === 'rev') { u.from = gn.id; u.to = node.id; } else { u.from = node.id; u.to = gn.id; }
    u.rt = 'idle'; u.ux = u.uy = null;
    if (dir === 'both') arrows.push(newArrow(u.to, u.from));
    sel.nodes = []; sel.arrow = u.id; sel.garrows = []; sel.grp = false;
    save(); updateConnUI(); draw();
    toast('矢印をノードにつなぎ、' + (which === 'first' ? '先頭' : '最終') + 'フレームのノードを生成しました');
  } catch (_) { toast('フレームを生成できませんでした'); }
  finally { u.framing = false; }
}
function attachFree(dir, u) {
  const [a, b] = sel.nodes;
  const { ab, ba } = pairArrows();
  if (dir === 'fwd') { if (ab) return; u.from = a; u.to = b; }
  else if (dir === 'rev') { if (ba) return; u.from = b; u.to = a; }
  else if (!ab) { u.from = a; u.to = b; if (!ba) arrows.push(newArrow(b, a)); }   // 両方：残りの向きは動画なしの矢印を追加
  else if (!ba) { u.from = b; u.to = a; }
  else return;
  u.rt = 'idle'; u.ux = u.uy = null;
  sel.nodes = []; sel.arrow = u.id;          // つないだ矢印を選択したままにする
  save(); updateConnUI(); draw();
  toast('矢印をノードにつなぎました');
}
/* リンク済みの矢印の向きを逆にする／逆向きの矢印を追加する */
function connectLinked(dir, x) {
  if (reverseOf(x)) return;
  if (dir === 'rev') { const f = x.from; x.from = x.to; x.to = f; x.rt = 'idle'; }
  else if (dir === 'both') arrows.push(newArrow(x.to, x.from));
  else return;
  save(); updateConnUI(); draw();
}
function disconnect() {
  const st = connState();
  if (st.kind === 'linked') {                // 接続を解除して未リンクの矢印に変換
    const x = st.a, g = geom(x);
    if (!x.video) {                          // 動画のない矢印は置き場がないので削除
      arrows = arrows.filter(y => y !== x); clearSel();
      toast('動画のない矢印は削除しました');
    } else {
      x.ux = g.vc.x; x.uy = g.vc.y; x.from = null; x.to = null;
      toast('未リンクの矢印にしました');
    }
    save(); updateConnUI(); draw(); return;
  }
  if (st.kind === 'nodefree') {              // 選択ノードにつながる矢印をすべて外す（動画があれば未リンクの矢印に、なければ削除）
    const r = detachArrows(arrows.filter(x => x.from === st.node.id || x.to === st.node.id));
    if (sel.arrow && !arrowById(sel.arrow)) sel.arrow = null;
    save(); updateConnUI(); draw(); toast(detachMsg(r)); return;
  }
  const { ab, ba } = pairArrows();
  if (!ab && !ba) return;
  arrows = arrows.filter(x => x !== ab && x !== ba);
  if (sel.arrow && !arrowById(sel.arrow)) sel.arrow = null;
  save(); updateConnUI(); draw();
}
$('#cFwd').onclick = () => connect('fwd');
$('#cRev').onclick = () => connect('rev');
$('#cBoth').onclick = () => connect('both');
$('#cDel').onclick = disconnect;

/* ---------- モード ---------- */
function setMode(m) {

let pickCtx = null;

/* ---------- コピー／切り取り／貼り付け ---------- */
let clip = null, lastPaste = null, lastPt = null;   // clip＝アプリ内クリップボード
function selParts() {                        // 選択中のノード・未リンクの矢印・（単独で選んだ）リンク済みの矢印
  const ns = sel.nodes.map(nodeById).filter(Boolean);
  const ids = new Set(sel.garrows); if (sel.arrow) ids.add(sel.arrow);
  const fa = [...ids].map(arrowById).filter(a => a && isFree(a));
  const la = sel.arrow && arrowById(sel.arrow);
  const single = !ns.length && la && !isFree(la) ? la : null;
  return { ns, fa, single };
}
function copySel(quiet) {
  const { ns, fa, single } = selParts();
  if (!ns.length && !fa.length && !single) { if (!quiet) toast('コピーするものが選択されていません'); return false; }
  if (single && !single.video) { toast('動画のない矢印はコピーできません'); return false; }
  const ids = new Set(ns.map(n => n.id));
  const c = { nodes: [], arrows: [] };
  ns.forEach(n => c.nodes.push({ id: n.id, name: n.name, x: n.x, y: n.y, image: n.image, imageHash: n.imageHash || null, pw: n.pw, ph: n.ph, tags: (n.tags || []).slice() }));
  arrows.forEach(a => {                      // 選択ノード同士をつなぐ矢印は一緒にコピー
    if (ids.has(a.from) && ids.has(a.to)) c.arrows.push({ from: a.from, to: a.to, ux: null, uy: null, video: a.video, videoHash: a.videoHash || null, vw: a.vw, vh: a.vh, tags: (a.tags || []).slice() });
  });
  const freeCopy = (a, x, y) => c.arrows.push({ from: null, to: null, ux: x, uy: y, video: a.video, videoHash: a.videoHash || null, vw: a.vw, vh: a.vh, tags: (a.tags || []).slice() });
  fa.forEach(a => freeCopy(a, a.ux, a.uy));
  if (single) { const g = geom(single); freeCopy(single, g.vc.x, g.vc.y); }   // リンク済みの矢印は未リンクの矢印として貼り付け
  const pts = [...c.nodes.map(n => [n.x, n.y]), ...c.arrows.filter(a => !a.from).map(a => [a.ux, a.uy])];
  c.cx = (Math.min(...pts.map(q => q[0])) + Math.max(...pts.map(q => q[0]))) / 2;
  c.cy = (Math.min(...pts.map(q => q[1])) + Math.max(...pts.map(q => q[1]))) / 2;
  clip = c; lastPaste = null;
  if (!quiet) toast(`コピーしました（ノード ${c.nodes.length} 件・矢印 ${c.arrows.length} 本）`);
  return true;
}
function cutSel() {
  const { ns, fa, single } = selParts();
  if (!copySel(true)) return toast(single && !single.video ? '動画のない矢印は切り取れません（Delete で接続解除できます）' : ' 切り取るものが選択されていません'.trim());
  const ids = new Set(ns.map(n => n.id));
  const inner = arrows.filter(a => ids.has(a.from) && ids.has(a.to));
  const edge = arrows.filter(a => (ids.has(a.from) || ids.has(a.to)) && !inner.includes(a));

function startPinch() {
  clearTimeout(g.timer);
  if (g.slider) { endSlider(g); g.slider = null; }
  g.pinched = true; g.drags = null; g.scale = null; band = null;
  const [p, q] = [...ptrs.values()];
  g.d0 = Math.hypot(p.x - q.x, p.y - q.y) || 1;
  const c = { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 };
  g.v0 = { ...view }; g.c0 = c; g.rz = false;
  g.wc = { x: (c.x - view.x) / view.s, y: (c.y - view.y) / view.s };
  g.target = null;
  if (mode === 'layout') {
    if (sel.nodes.length === 1) {
      const n = nodeById(sel.nodes[0]);
      if (n && n.image) g.target = { k: 'node', o: n, w0: n.pw, h0: n.ph };
    } else if (sel.arrow) {
      const a = arrowById(sel.arrow);
      if (a && a.video) g.target = { k: 'arrow', o: a, w0: a.vw, h0: a.vh };
    }
  }
}

cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!g) return;
  if (g.pan) { view.x = g.vx + e.clientX - g.sx; view.y = g.vy + e.clientY - g.sy; draw(); return; }
  if (g.pinched) {
    if (ptrs.size < 2) return;
    const [p, q] = [...ptrs.values()];
    const r = (Math.hypot(p.x - q.x, p.y - q.y) || 1) / g.d0;
    const c = { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 };
    if (g.target) {
      let rz = r;                            // 平行移動だけのときはサイズを変えない
      if (!g.rz) { if (Math.abs(r - 1) < 0.06) rz = 1; else g.rz = true; }
      const t = g.target, nw = clamp(t.w0 * rz, 40, 1600), k = nw / t.w0;
      if (t.k === 'node') { t.o.pw = nw; t.o.ph = t.h0 * k; }
      else { t.o.vw = nw; t.o.vh = t.h0 * k; }
      view.x = g.v0.x + c.x - g.c0.x; view.y = g.v0.y + c.y - g.c0.y;   // 2本指スワイプでキャンバス移動
    } else {
      const s = clamp(g.v0.s * r, 0.15, 5);
      view.s = s; view.x = c.x - g.wc.x * s; view.y = c.y - g.wc.y * s;
    }
    draw(); return;
  }
  if (g.slider) { seekFromX(g.slider.a, e.clientX); return; }
  if (g.scale) {
    const sc = g.scale, f = clamp(Math.hypot(e.clientX - sc.asx, e.clientY - sc.asy) / sc.d0, 0.1, 10);
    sc.items.forEach(d => { d.o[d.kx] = sc.ax + (d.ox - sc.ax) * f; d.o[d.ky] = sc.ay + (d.oy - sc.ay) * f; });
    g.moved = true; draw(); return;
  }
  const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
  if (!g.moved && Math.hypot(dx, dy) > 8) { g.moved = true; clearTimeout(g.timer); }
  if (!g.moved) return;
  if (g.drags) { g.px = e.clientX; g.py = e.clientY; applyDrag(); startAutoScroll(); }
  else if (mode === 'layout') band = { x0: g.sx, y0: g.sy, x1: e.clientX, y1: e.clientY };   // 範囲選択
  else { view.x = g.vx + dx; view.y = g.vy + dy; }
  draw();
});

function applyBand(b) {                      // 範囲内のノードと未リンクの矢印を選択
  const p = toWorld(Math.min(b.x0, b.x1), Math.min(b.y0, b.y1)), q = toWorld(Math.max(b.x0, b.x1), Math.max(b.y0, b.y1));
  const hit = (x0, y0, x1, y1) => x0 <= q.x && x1 >= p.x && y0 <= q.y && y1 >= p.y;
  sel.nodes = nodes.filter(n => { const bx = box(n); return hit(n.x - bx.w / 2, n.y - bx.h / 2, n.x + bx.w / 2, n.y + bx.h / 2 + nodeExtra(n)); }).map(n => n.id);
  sel.arrow = null;
  sel.garrows = arrows.filter(a => isFree(a) && a.video && hit(a.ux - a.vw / 2, a.uy - a.vh / 2, a.ux + a.vw / 2, a.uy + a.vh / 2 + arrowExtra(a))).map(a => a.id);
  sel.grp = sel.nodes.length + sel.garrows.length > 0;
  updateConnUI(); draw();
  if (sel.nodes.length + sel.garrows.length) toast(`ノード ${sel.nodes.length} 件・未リンクの矢印 ${sel.garrows.length} 本を選択`);
}
function selectAll() {                       // Ctrl+A：ノードと未リンクの矢印をすべて選択（レイアウトモードへ切り替え）
  const fr = arrows.filter(a => isFree(a) && a.video);
  if (!nodes.length && !fr.length) return;
  if (mode !== 'layout') setMode('layout');
  sel.nodes = nodes.map(n => n.id); sel.arrow = null; sel.garrows = fr.map(a => a.id); sel.grp = true;
  updateConnUI(); draw();
  toast(`ノード ${sel.nodes.length} 件・未リンクの矢印 ${sel.garrows.length} 本を選択`);
}
function pointerEnd(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (!g || ptrs.size > 0) return;
  clearTimeout(g.timer);
  const gg = g; g = null;
  if (gg.pan) return;
  if (band) { const b = band; band = null; if (e.type === 'pointerup' && gg.moved && !gg.pinched && !gg.drags) applyBand(b); draw(); }
  if (gg.slider) { endSlider(gg); return; }
  if (gg.scale) { if (gg.moved) save(); return; }
  if (e.type === 'pointerup' && !gg.moved && !gg.long && !gg.pinched) onTap(gg);

cv.addEventListener('pointercancel', pointerEnd);
let lastPtrType = 'mouse';
cv.addEventListener('contextmenu', e => {    // マウスの右クリック：長押しせずにすぐサブメニューを表示（タッチの長押しは従来のタイマーで処理）
  e.preventDefault();

  if (g) { clearTimeout(g.timer); g.long = true; }
  const w = toWorld(e.clientX, e.clientY);
  onLong({ hit: hitTest(w.x, w.y), w, sx: e.clientX, sy: e.clientY });

// PC: ホイールでズーム
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const w = toWorld(e.clientX, e.clientY);
  const s = clamp(view.s * Math.exp(-e.deltaY * 0.0015), 0.15, 5);
  view.s = s; view.x = e.clientX - w.x * s; view.y = e.clientY - w.y * s;

/* ---------- JSON保存・読み込み ---------- */
function serialize() {
  return {
    app: 'keyframe-map', version: 1,
    nodes: nodes.map(n => ({
      id: n.id, name: n.name,
      x: Math.round(n.x * 10) / 10, y: Math.round(n.y * 10) / 10,
      imageFile: n.image || null,
      imageHash: n.image ? (mediaHash.get(n.image) || n.imageHash || null) : null,
      previewW: n.image ? Math.round(n.pw * 10) / 10 : null,
      previewH: n.image ? Math.round(n.ph * 10) / 10 : null,
      ...(n.tags && n.tags.length ? { tags: n.tags.slice() } : {})
    })),
    arrows: arrows.map(a => {
      const gm = geom(a), f = nodeById(a.from), t = nodeById(a.to);
      return {
        id: a.id, from: a.from == null ? null : a.from, to: a.to == null ? null : a.to,   // 未リンクの矢印は null
        x: gm ? Math.round(gm.mid.x * 10) / 10 : null,
        y: gm ? Math.round(gm.mid.y * 10) / 10 : null,
        angle: f && t ? Math.round(Math.atan2(t.y - f.y, t.x - f.x) * 1800 / Math.PI) / 10 : null,
        videoFile: a.video || null,
        videoHash: a.video ? (mediaHash.get(a.video) || a.videoHash || null) : null,
        previewW: a.video ? Math.round(a.vw * 10) / 10 : null,
        previewH: a.video ? Math.round(a.vh * 10) / 10 : null,
        ...(a.tags && a.tags.length ? { tags: a.tags.slice() } : {})
      };
    })
  };
}
function deserialize(o) {
  if (!o || !Array.isArray(o.nodes)) throw new Error('形式が正しくありません');
  vids.forEach(v => v.el.pause());
  nodes = o.nodes.map(n => {
    const img = n.imageFile || null;
    return {
      id: String(n.id ?? uid()), name: String(n.name ?? ''), x: +n.x || 0, y: +n.y || 0,
      image: img, imageHash: img ? (n.imageHash || null) : null,
      pw: img ? (+n.previewW || 160) : null, ph: img ? (+n.previewH || 120) : null,
      tags: cleanTags(n.tags)
    };
  });
  const ids = new Set(nodes.map(n => n.id));
  arrows = (o.arrows || []).filter(a => {
    const hasF = a.from != null, hasT = a.to != null;
    if (hasF && hasT) return ids.has(String(a.from)) && ids.has(String(a.to));
    return !hasF && !hasT && !!a.videoFile;  // 未リンクの矢印（動画が必要）
  }).map(a => {
    const v = a.videoFile || null, free = a.from == null;
    return {
      id: String(a.id ?? uid()), from: free ? null : String(a.from), to: free ? null : String(a.to),
      ux: free ? (+a.x || 0) : null, uy: free ? (+a.y || 0) : null,
      video: v, videoHash: v ? (a.videoHash || null) : null,
      vw: v ? (+a.previewW || 200) : null, vh: v ? (+a.previewH || 113) : null,
      tags: cleanTags(a.tags)
    };
  });
  clearSel(); updateConnUI();
}
function missingMedia() {
  const s = new Set();
  nodes.forEach(n => { if (n.image && !media.has(n.image)) s.add(n.image); });
  arrows.forEach(a => { if (a.video && !media.has(a.video)) s.add(a.video); });
  return s.size;
}
async function saveJSON() {
  if (hashJobs.size) await Promise.all([...hashJobs.values()]);   // 計算中のハッシュを待つ
  const blob = new Blob([JSON.stringify(serialize(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'keyframe-map.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('JSONを保存しました');
}
$('#jsonPick').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    deserialize(JSON.parse(await f.text()));
    const rn = relinkRefs();                 // 既に読み込み済みのメディアとハッシュ照合
    save(); draw();
    const m = missingMedia();
    toast('読み込み完了' + (rn ? `（ハッシュ一致で ${rn} 件のファイル名を更新）` : '') +
      (m ? `　未リンクのメディア ${m} 件：ファイル→メディア再リンク` : ''));
  } catch (err) { toast('読み込み失敗：' + err.message); }
};

/* メディア再リンク：JSONのファイル名・ハッシュのどちらにも該当しないファイルは新規として読み込む
   （静止画→新規ノード、動画→ノードにつながっていない「未リンクの矢印」） */
const isImageFile = f => (f.type || '').startsWith('image/') || /\.(png|jpe?g|gif|webp|avif|bmp|svg|heic|heif)$/i.test(f.name);
const isVideoFile = f => (f.type || '').startsWith('video/') || /\.(mp4|m4v|mov|webm|mkv|avi|ogv|3gp)$/i.test(f.name);
function freeOrigin() {                      // 新規アイテムを並べ始める位置（既存の内容の下）
  let minX = Infinity, maxY = -Infinity;
  nodes.forEach(n => { const b = box(n); minX = Math.min(minX, n.x - b.w / 2); maxY = Math.max(maxY, n.y + b.h / 2 + 30 + tagH(n)); });
  arrows.forEach(a => {
    const gm = a.video && geom(a); if (!gm) return;
    minX = Math.min(minX, gm.vc.x - a.vw / 2); maxY = Math.max(maxY, gm.vc.y + a.vh / 2 + 50 + tagH(a));
  });
  if (!isFinite(minX)) { const p = toWorld(80, 120); return { x: p.x, y: p.y }; }
  return { x: minX, y: maxY + 40 };
}
const GRID = { cols: 5, dx: 260, dy: 250 };
/* 同名で内容（ハッシュ）が異なるファイルは別のファイルとして扱い、あとのものに連番（_2, _3…）を付けて両方保持する */
const serialName = (n, taken) => {
  const m = n.replace(/\.[^.]+$/, ''), e = n.slice(m.length);
  let i = 2; while (taken.has(m + '_' + i + e)) i++;
  return m + '_' + i + e;
};
async function planRelink(files) {           // 戻り値：{ plan:[{file,name,h,same}], renamed:連番を付けた件数 }
  if (hashJobs.size) await Promise.all([...hashJobs.values()]);
  const hs = await Promise.all(files.map(f => fileHash(f).catch(() => null)));
  const refHash = name => {                  // JSONが記録している、そのファイル名のハッシュ
    const n = nodes.find(x => x.image === name), a = arrows.find(x => x.video === name);
    return (n && n.imageHash) || (a && a.videoHash) || null;
  };
  const taken = new Set(media.keys());       // 連番の名前が衝突しないよう、使用中・参照中・今回選んだ名前を除外
  files.forEach(f => taken.add(f.name));
  nodes.forEach(n => { if (n.image) taken.add(n.image); });
  arrows.forEach(a => { if (a.video) taken.add(a.video); });
  const groups = new Map();
  files.forEach((f, i) => { if (!groups.has(f.name)) groups.set(f.name, []); groups.get(f.name).push({ f, h: hs[i] }); });
  const plan = []; let renamed = 0;
  for (const [name, list] of groups) {
    const vars = [];                         // 内容の異なる候補（同じ内容は1つにまとめる。ハッシュ不明なものは同名を同一視）
    list.forEach(v => { const k = vars.findIndex(x => !x.h || !v.h || x.h === v.h); if (k >= 0) vars[k] = v; else vars.push(v); });
    const loaded = media.has(name), cur = loaded ? (mediaHash.get(name) || null) : null;
    let keep;                                // 元の名前のまま使う候補
    if (loaded) keep = vars.findIndex(v => !cur || !v.h || v.h === cur);   // 読み込み済みと同じ内容のもの
    else { const rh = refHash(name); keep = Math.max(0, vars.findIndex(v => rh && v.h === rh)); }
    vars.forEach((v, k) => {
      if (k === keep) { plan.push({ file: v.f, name, h: v.h, same: !!(loaded && cur && v.h === cur) }); return; }
      const nn = serialName(name, taken); taken.add(nn); renamed++;
      plan.push({ file: new File([v.f], nn, { type: v.f.type, lastModified: v.f.lastModified }), name: nn, h: v.h, same: false });
    });
  }
  return { plan, renamed };
}
let relinking = false;
async function relinkFiles(files) {
  if (!files.length) return;
  if (relinking) return toast('処理中です。しばらくしてからやり直してください');
  relinking = true;
  try { await relinkRun(files); } finally { relinking = false; }
}
/* メディア再リンクした動画につながっている矢印の前後のノードで、静止画が空のものは動画の先頭／最終フレームから生成する */
/* 自動生成された静止画ノードかどうかの推定：ノード名の末尾が「先頭」「最終」、または画像名が *_first／*_last */
const genKind = n => {
  const nm = n.name || '', im = n.image || '';
  if (/先頭\s*$/.test(nm) || /_first(_\d+)?\.[^.]+$/i.test(im)) return 'first';
  if (/最終\s*$/.test(nm) || /_last(_\d+)?\.[^.]+$/i.test(im)) return 'last';
  return null;
};
/* 静止画が空、または画像名はあるがファイルが未リンクで、自動生成と推定されるノード（先頭／最終の種別が合うもの）は再生成の対象 */
const needFrame = (n, which) => {
  if (!n.image) return true;
  if (media.has(n.image)) return false;
  const k = genKind(n);
  return !!k && k === which;
};
async function fillEmptyFrames(names) {
  let cnt = 0;
  for (const a of arrows.slice()) {
    if (isFree(a) || !a.video || !names.has(a.video) || !media.has(a.video)) continue;
    const f = nodeById(a.from), t = nodeById(a.to);
    const needF = !!f && needFrame(f, 'first'), needT = !!t && needFrame(t, 'last');
    if (!needF && !needT) continue;
    try {
      const fr = await extractFrames(a.video, needF && needT ? undefined : needF ? 'first' : 'last');
      const base = a.video.replace(/\.[^.]+$/, '');
      const put = async (node, blob, suffix) => {
        const fn = registerFile(new File([blob], uniqueName(base + suffix + '.png'), { type: 'image/png' }));
        generated.add(fn);
        await Promise.race([new Promise(res => applyNodeImage(node, fn, res)), new Promise(res => setTimeout(res, 5000))]);
        cnt++;
      };
      if (needF && fr.first) await put(f, fr.first, '_first');
      if (needT && fr.last) await put(t, fr.last, '_last');
    } catch (_) {}
  }
  return cnt;
}
async function relinkRun(files) {
  toast('ファイルを照合中…');
  const { plan, renamed: serialN } = await planRelink(files);
  plan.forEach(p => { if (!p.same) registerFile(p.file, p.h); });   // 読み込み済みと同一内容のものは登録し直さない
  draw();
  const rn = relinkRefs();                   // 名前が見つからないものはハッシュ一致で付け替え

  // ファイル名でもハッシュでもJSONの内容に該当しなかったファイルを新規として追加
  const used = new Set();
  nodes.forEach(n => { if (n.image) used.add(n.image); });
  arrows.forEach(a => { if (a.video) used.add(a.video); });
  const fresh = plan.map(p => p.file).filter(f => !used.has(f.name));
  const newImgs = fresh.filter(isImageFile), newVids = fresh.filter(f => !isImageFile(f) && isVideoFile(f));
  const placed = [];
  let framed = 0, badVids = 0;               // フレームを自動生成できた動画の数／読み込めなかった動画の数
  if (newImgs.length || newVids.length) {
    const o = freeOrigin();
    const spot = i => {                      // i番目のセルの中心
      const p = { x: o.x + GRID.dx / 2 + (i % GRID.cols) * GRID.dx, y: o.y + GRID.dy / 2 + Math.floor(i / GRID.cols) * GRID.dy };
      placed.push(p); return p;
    };
    newImgs.forEach((f, i) => {
      const p = spot(i);
      const n = { id: uid(), name: f.name, x: p.x, y: p.y, image: null, imageHash: null, pw: null, ph: null };
      nodes.push(n);
      applyNodeImage(n, f.name);

    // 動画は画像の次の行から。先頭フレーム→動画→最終フレームの3点セットを横に並べる（1行に2セット）
    const SET_W = 640, SET_PER_ROW = 2;
    let col = 0, rowTop = o.y + Math.ceil(newImgs.length / GRID.cols) * GRID.dy, rowH = 0;
    if (newVids.length) toast('動画から先頭・最終フレームを生成中…');
    for (const f of newVids) {
      const a = { id: uid(), from: null, to: null, ux: o.x, uy: o.y, video: null, videoHash: null, vw: null, vh: null };
      arrows.push(a);
      const ok = await new Promise(res => applyArrowVideo(a, f.name,
        () => { arrows = arrows.filter(x => x !== a); draw(); res(false); },   // 読み込めなければ取り消す
        () => res(true)));
      if (!ok) { badVids++; continue; }
      const h = Math.max(a.vh + 70, 160 * a.vh / a.vw + 40);          // 縦長の動画でも重ならない行の高さ
      if (col === SET_PER_ROW) { col = 0; rowTop += rowH; rowH = 0; }
      a.ux = o.x + SET_W / 2 + col * SET_W; a.uy = rowTop + h / 2;
      placed.push({ x: a.ux, y: a.uy });
      rowH = Math.max(rowH, h); col++;
      if (await autoFrames(a)) framed++;
    }
    if (placed.length) {                     // 追加したアイテムが見える位置へ移動
      const cx = (Math.min(...placed.map(p => p.x)) + Math.max(...placed.map(p => p.x))) / 2;
      const cy = (Math.min(...placed.map(p => p.y)) + Math.max(...placed.map(p => p.y))) / 2;
      view.x = W / 2 - cx * view.s; view.y = H / 2 - cy * view.s;

    clearSel(); updateConnUI();

  const filled = await fillEmptyFrames(new Set(plan.map(p => p.name)));   // リンク済みの矢印に一致した動画でも、前後の静止画が空なら生成
  save(); draw();
  const m = missingMedia();
  const parts = [m ? `リンク完了（未リンク ${m} 件）` : 'すべてのメディアをリンクしました'];
  if (rn) parts.push(`ハッシュ一致でファイル名を更新：${rn} 件`);
  if (serialN) parts.push(`同名で内容が異なるファイル ${serialN} 件に連番を付けて別々に保持`);
  if (newImgs.length) parts.push(`新規ノード ${newImgs.length} 件を追加`);
  if (filled) parts.push(`空または未リンクの自動生成の静止画 ${filled} 件を動画から生成`);
  const addedVids = newVids.length - badVids;
  if (addedVids) parts.push(framed === addedVids

  function attempt(f, budget) {
    cw = Math.max(maxNW + 30, (maxNW + maxPW + 30) * f);
    ch = Math.max(maxNH + 30, (maxNH + maxPH + 30) * f);
    S = Math.ceil(N * 1.3) + 1;                                   // 空きの区画を少し用意して移動しやすくする
    const aspect = clamp(W / H, 0.8, 2);
    cols = clamp(Math.ceil(Math.sqrt(S * (ch / cw) * aspect)), 1, S);
    rows = Math.ceil(S / cols); S = cols * rows;
    occ = new Int32Array(S).fill(-1);
    for (let i = 0; i < N; i++) { place(i, i); occ[i] = i; }      // まず並び順どおりに配置
    let best = 0, bestSlots = slotOf.slice();
    if (N > 1) {
      const T0 = 100, T1 = 1, t0ms = performance.now();
      let it = 0, Tm = T0, cum = 0;
      for (;;) {
        if ((it++ & 127) === 0) {
          const el = performance.now() - t0ms;
          if (el > budget) break;
          Tm = T0 * Math.pow(T1 / T0, el / budget);
        }
        const a = (Math.random() * N) | 0, sa = slotOf[a];
        let s;
        if (Math.random() < 0.6) {
          const c = sa % cols, r = (sa / cols) | 0;
          s = clamp(r + ((Math.random() * 5) | 0) - 2, 0, rows - 1) * cols + clamp(c + ((Math.random() * 5) | 0) - 2, 0, cols - 1);
        } else s = (Math.random() * S) | 0;
        if (s === sa) continue;
        const b = occ[s], dn = b >= 0 ? [a, b] : [a];
        const before = cost(local(dn));
        place(a, s); occ[s] = a;
        if (b >= 0) { place(b, sa); occ[sa] = b; } else occ[sa] = -1;
        const delta = cost(local(dn)) - before;
        if (delta <= 0 || Math.random() < Math.exp(-delta / Tm)) {
          cum += delta;
          if (cum < best - 1e-9) { best = cum; bestSlots = slotOf.slice(); }
        } else {                                                  // 元に戻す
          place(a, sa); occ[sa] = a;
          if (b >= 0) { place(b, s); occ[s] = b; } else occ[s] = -1;
        }
      }
    }
    for (let i = 0; i < N; i++) place(i, bestSlots[i]);
    const st = local(all);
    return { slots: bestSlots, cw, ch, cols, st };
  }

  const budget = clamp(120 + N * 12, 150, 500);
  let pick = null;
  for (const f of [0.7, 1.0, 1.3, 1.7, 2.2]) {    // 重ならない最も詰まった間隔を採用
    const r = attempt(f, budget);
    const bad = r.st.over * 1000 + r.st.cross + r.st.thru;
    if (!pick || bad < pick.bad) pick = { ...r, bad };
    if (!r.st.over) break;
  }
  cw = pick.cw; ch = pick.ch; cols = pick.cols;
  for (let i = 0; i < N; i++) place(i, pick.slots[i]);
  let ox = 0, oy = 0, x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  order.forEach(n => { ox += n.x; oy += n.y; });
  ox /= N; oy /= N;                                               // 元の中心の位置に置く
  for (let i = 0; i < N; i++) { x0 = Math.min(x0, px[i]); x1 = Math.max(x1, px[i]); y0 = Math.min(y0, py[i]); y1 = Math.max(y1, py[i]); }
  order.forEach((n, i) => { n.x = px[i] - (x0 + x1) / 2 + ox; n.y = py[i] - (y0 + y1) / 2 + oy; });
  return pick.st;
}

function contentBox(skipFree) {              // ノードと動画プレビューを囲む範囲
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (ax, ay, bx, by) => { x0 = Math.min(x0, ax); y0 = Math.min(y0, ay); x1 = Math.max(x1, bx); y1 = Math.max(y1, by); };
  nodes.forEach(n => { const b = box(n); add(n.x - b.w / 2, n.y - b.h / 2, n.x + b.w / 2, n.y + b.h / 2 + nodeExtra(n)); });
  arrows.forEach(a => {
    if (!a.video || (skipFree && isFree(a))) return;
    const g = geom(a); if (g) add(g.vc.x - a.vw / 2, g.vc.y - a.vh / 2, g.vc.x + a.vw / 2, g.vc.y + a.vh / 2 + arrowExtra(a));
  });
  return isFinite(x0) ? { x0, y0, x1, y1 } : null;
}
function placeFreeArrows() {                 // 未リンクの矢印は、ノードの下に動画名順で並べる
  const fr = arrows.filter(a => isFree(a) && a.video).sort((a, b) => natCmp(a.video, b.video));
  if (!fr.length) return;
  const bb = contentBox(true) || { x0: 0, y0: 0, x1: 900, y1: -70 };
  const maxW = Math.max(bb.x1 - bb.x0, 900);
  let cx = bb.x0, top = bb.y1 + 70, rowH = 0;
  for (const a of fr) {
    if (cx > bb.x0 && cx + a.vw > bb.x0 + maxW) { cx = bb.x0; top += rowH + 30; rowH = 0; }
    a.ux = cx + a.vw / 2; a.uy = top + a.vh / 2;
    cx += a.vw + 50; rowH = Math.max(rowH, a.vh + 50 + tagH(a));
  }
}
function fitView() {                         // 全体が画面に収まるように表示を合わせる
  const bb = contentBox(false); if (!bb) return;
  const bw = bb.x1 - bb.x0, bh = bb.y1 - bb.y0;
  const s = clamp(Math.min((W - 32) / bw, (H - 130) / bh), 0.15, 1);
  view.s = s; view.x = W / 2 - (bb.x0 + bw / 2) * s; view.y = (H + 60) / 2 - (bb.y0 + bh / 2) * s;
}
async function arrange(kind) {
  if (arranging) return;
  if (!nodes.length && !arrows.some(a => isFree(a) && a.video)) return toast('並べ替えるノードがありません');
  arranging = true; closePopups();
  toast(kind === 'tag' ? 'タグの類似度で並べ替え中…' : '画像の類似度を計算して並べ替え中…');
  try {
    await new Promise(r => setTimeout(r, 30));
    commitHist(); if (lastSnap) lastSnap.view = { ...view };   // アンドゥで表示位置も戻す
    const order = kind === 'tag' ? sortedByTag() : await sortedBySimilarity();
    const st = nodes.length ? layoutNodes(order, kind === 'image') : { cross: 0, thru: 0, over: 0, back: 0 };
    placeFreeArrows();
    fitView(); save(); draw();
    const note = [];
    if (st.thru) note.push(`ノードを貫く矢印 ${st.thru} 件`);
    if (st.over) note.push(`重なり ${st.over} 件`);
    if (st.back) note.push(`左向きの矢印 ${st.back} 件`);
    if (kind === 'tag' && !nodes.some(n => n.tags && n.tags.length)) note.push('タグ付きのノードがないため名前順');
    if (kind === 'image' && simNote) note.push(simNote);
    toast(`並べ替えました（矢印の交差 ${st.cross} 件${note.length ? '、' + note.join('、') : ''}）`);
  } catch (err) { toast('並べ替えに失敗しました'); }
  finally { arranging = false; }
}

/* ---------- アンドゥ／リドゥ ---------- */
/* save() のたびに前回の状態と比べ、変化していれば前回の状態を履歴に積む（画像・動画の中身やハッシュだけの更新は無視） */
const HIST_MAX = 50;
let undoSt = [], redoSt = [], lastSnap = null;
const stateKey = () => JSON.stringify([
  nodes.map(n => [n.id, n.name, n.x, n.y, n.image, n.pw, n.ph, n.tags || []]),
  arrows.map(a => [a.id, a.from, a.to, a.ux, a.uy, a.video, a.vw, a.vh, a.tags || []])
]);
function takeSnap() {
  return {
    key: stateKey(),
    nodes: nodes.map(n => ({ ...n, tags: (n.tags || []).slice() })),
    arrows: arrows.map(a => { const c = { ...a, tags: (a.tags || []).slice() }; delete c.rt; delete c.framing; return c; })
  };
}
function commitHist() {
  if (!lastSnap) { lastSnap = takeSnap(); return; }
  if (stateKey() === lastSnap.key) return;
  undoSt.push(lastSnap);
  if (undoSt.length > HIST_MAX) undoSt.shift();
  redoSt = [];
  lastSnap = takeSnap();
}
function applySnap(sn) {
  vids.forEach(v => v.el.pause());
  nodes = sn.nodes.map(n => ({ ...n, tags: (n.tags || []).slice() }));
  arrows = sn.arrows.map(a => ({ ...a, tags: (a.tags || []).slice(), rt: 'idle' }));
  if (sn.view) Object.assign(view, sn.view);
  lastSnap = sn;
  clearSel(); updateConnUI(); save(); draw();
}
function undo() {
  commitHist();
  if (!undoSt.length) return toast('元に戻せる操作がありません');
  const sn = undoSt.pop(), cur = lastSnap;
  if (sn.view) cur.view = { ...view };       // 並べ替えは表示位置も一緒に戻す
  redoSt.push(cur); applySnap(sn); toast('元に戻しました');
}
function redo() {
  commitHist();
  if (!redoSt.length) return toast('やり直せる操作がありません');
  const sn = redoSt.pop();
  undoSt.push(lastSnap); applySnap(sn); toast('やり直しました');
}

/* ---------- 自動保存（メディア本体は保存されません） ---------- */
let saveT = 0;
function save() {
  commitHist();
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(serialize())); } catch (_) {} }, 300);
}

/* ---------- フルスクリーン ---------- */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
$('#fsBtn').onclick = async () => {
  const d = document.documentElement;
  try {
    if (fsEl()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else if (d.requestFullscreen || d.webkitRequestFullscreen) await (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
    else toast('このブラウザはフルスクリーンに対応していません（ホーム画面に追加すると全画面で使えます）');
  } catch (_) { toast('フルスクリーンにできませんでした'); }
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => $('#fsBtn').classList.toggle('on', !!fsEl())));

/* ---------- 連続再生プレイヤー ---------- */
const player = $('#player'), pImg = $('#pImg'), pVid = $('#pVid'), pCap = $('#pCap');
/* 設定（端末のブラウザに保存） */
const SET_KEY = 'keyframe-map.settings.v1';
const settings = { still: 1.5, loop: 5, lmUrl: 'http://localhost:1234/v1', lmModel: '', vocab: '', noThink: true };   // still＝静止画の表示秒数／loop＝同じ箇所の最大ループ回数
try {
  const o = JSON.parse(localStorage.getItem(SET_KEY) || '{}');
  if (isFinite(o.still) && o.still > 0) settings.still = clamp(+o.still, 0.1, 60);
  if (isFinite(o.loop) && o.loop >= 1) settings.loop = clamp(Math.round(+o.loop), 1, 99);
  for (const k of ['lmUrl', 'lmModel', 'vocab']) if (typeof o[k] === 'string') settings[k] = o[k];
  if (typeof o.noThink === 'boolean') settings.noThink = o.noThink;
} catch (_) {}
$('#setBtn').onclick = () => {
  closePopups();
  $('#setStill').value = settings.still; $('#setLoop').value = settings.loop;
  $('#setLmUrl').value = settings.lmUrl; $('#setLmModel').value = settings.lmModel; $('#setVocab').value = settings.vocab; $('#setNoThink').checked = settings.noThink;
  $('#setDlg').hidden = false;
};
$('#setCancel').onclick = () => { $('#setDlg').hidden = true; };
$('#setLmTest').onclick = lmTest;
$('#setOk').onclick = () => {
  const st = parseFloat($('#setStill').value), lp = parseInt($('#setLoop').value, 10);
  settings.still = isFinite(st) && st > 0 ? clamp(Math.round(st * 10) / 10, 0.1, 60) : settings.still;
  settings.loop = isFinite(lp) && lp >= 1 ? clamp(lp, 1, 99) : settings.loop;
  settings.lmUrl = lmBaseOf($('#setLmUrl').value); settings.lmModel = $('#setLmModel').value.trim(); settings.vocab = $('#setVocab').value.trim();
  settings.noThink = $('#setNoThink').checked; lmPrefillOK = lmSchemaOK = true;   // 設定を変えたら対応状況の判定をやり直す
  try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch (_) {}
  $('#setDlg').hidden = true; toast('設定を保存しました');
};
const visits = new Map();                    // 連続再生で各ノード／矢印を再生した回数（ランダムジャンプでリセット）
const vkey = it => it.k + ':' + it.id;
let playId = 0, stillTimer = 0, pFail = 0, pHops = 0;

const nodeOK = n => !!(n && n.image && media.has(n.image));
const arrowOK = a => !!(a && a.video && media.has(a.video));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function playables() {
  const l = [];
  nodes.forEach(n => { if (nodeOK(n)) l.push({ k: 'node', id: n.id }); });
  arrows.forEach(a => { if (arrowOK(a)) l.push({ k: 'arrow', id: a.id }); });
  return l;
}
function randomItem(exclude) {
  const l = playables();
  if (!l.length) return null;
  const c = exclude && l.length > 1 ? l.filter(i => !(i.k === exclude.k && i.id === exclude.id)) : l;
  return pick(c);
}
function nextItem(it) {
  if (it.k === 'arrow') {
    const a = arrowById(it.id);
    return a && nodeById(a.to) ? { k: 'node', id: a.to } : null;   // 未リンクの矢印は行き先がないのでランダムへ
  }
  const outs = arrows.filter(a => a.from === it.id && nodeById(a.to));
  if (!outs.length) return null;
  const ok = outs.filter(arrowOK);
  return { k: 'arrow', id: pick(ok.length ? ok : outs).id };
}
function startItem() {
  if (sel.arrow && arrowById(sel.arrow)) return { k: 'arrow', id: sel.arrow };
  if (sel.nodes.length && nodeById(sel.nodes[0])) return { k: 'node', id: sel.nodes[0] };
  return randomItem(null);
}
function goNext(it) {
  const nx = nextItem(it);
  // 同じ箇所へ入る回数が上限に達するか、リンク先がなければ、ランダムにジャンプして再開（回数はリセット）
  if (nx && (visits.get(vkey(nx)) || 0) < settings.loop - 1) return playItem(nx);
  visits.clear();
  playItem(randomItem(nx || it));
}
function passThrough(it) {                   // 再生できない項目は飛ばして次へ
  if (++pHops > nodes.length + arrows.length + 2) { pHops = 0; return playItem(randomItem(it)); }
  goNext(it);
}
function fail(it) {
  if (++pFail > 5) return stopPlayer('メディアを再生できませんでした');
  passThrough(it);
}
function showStill(url, cap, my, done, ng) {
  pVid.pause();
  pImg.src = url;
  const reveal = () => {
    if (my !== playId) return;
    pImg.style.visibility = 'visible'; pVid.style.visibility = 'hidden';
    pCap.textContent = cap; done();
  };
  (pImg.decode ? pImg.decode() : Promise.resolve()).then(reveal, () => { if (my === playId) ng(); });
}
function revealPlaying() {                   // 縮小表示中、再生中の項目が画面外ならキャンバスをそこへ移動する
  if (!nowPlaying || player.hidden || !player.classList.contains('mini')) return;
  let c = null;
  if (nowPlaying.k === 'node') { const n = nodeById(nowPlaying.id); if (n) c = { x: n.x, y: n.y }; }
  else { const a = arrowById(nowPlaying.id), g = a && geom(a); if (g) c = { x: g.vc.x, y: g.vc.y }; }
  if (!c) return;
  const sx = c.x * view.s + view.x, sy = c.y * view.s + view.y, m = 80;
  if (sx < m || sx > W - m || sy < m + 40 || sy > H - m) { view.x = W / 2 - c.x * view.s; view.y = H / 2 - c.y * view.s; }
}
function setMini(m) {
  player.classList.toggle('mini', m);
  $('#pMin').disabled = m; $('#pMax').disabled = !m;
  if (m) revealPlaying();
  draw();
}
function playItem(it) {
  const my = ++playId;
  clearTimeout(stillTimer);
  if (!it) return stopPlayer('再生できるメディアがありません');
  nowPlaying = it; revealPlaying(); draw();
  visits.set(vkey(it), (visits.get(vkey(it)) || 0) + 1);
  if (it.k === 'node') {
    const n = nodeById(it.id);
    if (!nodeOK(n)) return passThrough(it);
    showStill(media.get(n.image), n.name || n.image, my, () => {
      pHops = 0; pFail = 0;
      stillTimer = setTimeout(() => { if (my === playId) goNext(it); }, settings.still * 1000);
    }, () => fail(it));
  } else {
    const a = arrowById(it.id);
    if (!arrowOK(a)) return passThrough(it);
    pVid.onplaying = () => {
      if (my !== playId) return;
      pHops = 0; pFail = 0;
      pVid.style.visibility = 'visible'; pImg.style.visibility = 'hidden';
      pCap.textContent = a.video;
    };
    pVid.onended = () => { if (my === playId) goNext(it); };
    pVid.onerror = () => { if (my === playId) fail(it); };
    pVid.src = media.get(a.video);
    const pr = pVid.play();
    if (pr && pr.catch) pr.catch(err => {
      if (my !== playId || (err && err.name === 'AbortError')) return;
      if (err && err.name === 'NotAllowedError') {   // 自動再生が制限される環境ではミュートで再生
        pVid.muted = true;
        pVid.play().catch(() => { if (my === playId) fail(it); });
      } else fail(it);
    });
  }
}
function openPlayer() {
  vids.forEach(e => e.el.pause());
  closePopups();
  const it = startItem();
  if (!it || !playables().length) {
    toast('再生できるメディアがありません（画像・動画を指定／再リンクしてください）');
    return;
  }
  pFail = 0; pHops = 0; pVid.muted = false; visits.clear();
  setMini(false);
  player.hidden = false;
  playItem(it);
}
function stopPlayer(msg) {
  playId++; clearTimeout(stillTimer); nowPlaying = null; setMini(false);
  pVid.onplaying = pVid.onended = pVid.onerror = null;
  pVid.pause(); pVid.removeAttribute('src'); pVid.load();
  pImg.removeAttribute('src');
  pImg.style.visibility = pVid.style.visibility = 'hidden';
  pCap.textContent = '';
  player.hidden = true;
  draw();
  if (msg) toast(msg);
}
$('#playBtn').onclick = openPlayer;
$('#pClose').onclick = () => stopPlayer();
$('#pMin').onclick = () => setMini(true);
$('#pMax').onclick = () => setMini(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !player.hidden) stopPlayer(); });
const kbBlocked = e => !player.hidden || !$('#dlg').hidden || !$('#setDlg').hidden ||
  !!(e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable]'));
document.addEventListener('keydown', e => {   // Ctrl(⌘)+Z：アンドゥ／Ctrl+Y・Ctrl+Shift+Z：リドゥ
  if (!(e.ctrlKey || e.metaKey) || e.altKey || kbBlocked(e)) return;
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); closePopups(); undo(); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); closePopups(); redo(); }
  else if (k === 'a' && !e.shiftKey) { e.preventDefault(); closePopups(); selectAll(); }
  else if (k === 'c' && !e.shiftKey) { e.preventDefault(); closePopups(); copySel(); }
  else if (k === 'x' && !e.shiftKey) { e.preventDefault(); closePopups(); cutSel(); }
  else if (k === 'v' && !e.shiftKey) { e.preventDefault(); closePopups(); pasteClip(pastePoint()); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Delete' && e.key !== 'Backspace') return;
  if (!player.hidden || !$('#dlg').hidden || !$('#setDlg').hidden) return;
  if (e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
  e.preventDefault(); closePopups(); deleteSelection();
});

/* ---------- 起動 ---------- */
function resize() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  draw();
}
window.addEventListener('resize', resize);
resize();
view.x = W / 2; view.y = H / 2;
try { const s = localStorage.getItem(STORE); if (s) deserialize(JSON.parse(s)); } catch (_) {}
lastSnap = takeSnap();
setMode('pencil');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
